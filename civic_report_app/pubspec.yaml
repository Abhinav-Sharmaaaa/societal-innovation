name: civic_report_app
description: Citizen civic issue reporting mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^18.0.1

  # Networking
  dio: ^5.5.0
  pretty_dio_logger: ^1.3.1

  # Local storage / offline queue
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure token storage
  flutter_secure_storage: ^11.1.0

  # Location
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Camera / images
  camera: ^0.12.1
  exif: ^3.3.0
  flutter_image_compress: ^2.3.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Background sync
  workmanager: ^0.10.10

  # Push notifications
  firebase_messaging: ^16.6.0
  firebase_core: ^4.14.0

  # Maps (OSM chosen by default — no API key required; swap for
  # google_maps_flutter if a Maps API key is available)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Utils
  uuid: ^4.4.2
  intl: ^0.20.3
  equatable: ^2.0.5

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/